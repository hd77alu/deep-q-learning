[project]
name = "pacman-dqn-formative"
version = "0.1.0"
description = "From-scratch PyTorch DQN for Atari Pac-Man"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.2",
    "gymnasium[atari]>=1.1",
    "ale-py>=0.10",
    "opencv-python>=4.8",
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "moviepy>=2.2.1",
]
